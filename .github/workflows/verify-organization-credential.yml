name: Verify organization reporting credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository_id == '1358408598' &&
      (github.repository == 'HemSoft/reports' || github.repository == 'hemsoft-dev/reports') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify owner and private organization read access
        env:
          GH_TOKEN: ${{ secrets.REPORTS_PAT }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          if not token:
              raise SystemExit('REPORTS_PAT is missing')

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/' + path,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response), response.headers.get('X-OAuth-Scopes', '')

          user, scopes = get('user')
          if user.get('login') != 'HemSoft' or 'repo' not in scopes.split(', '):
              raise SystemExit('Require the HemSoft reporting credential with repo scope for both owners')
          source, _ = get('repos/' + os.environ['GITHUB_REPOSITORY'])
          if source.get('id') != 1358408598:
              raise SystemExit('Reporting source identity mismatch')
          pilot, _ = get('repos/hemsoft-dev/sfl-migration-pilot-private')
          if pilot.get('id') != 1408025382 or pilot.get('private') is not True:
              raise SystemExit('Private organization pilot identity mismatch')
          print('REPORTS_PAT owner HemSoft, repo scope and private organization access verified.')
          print('Source repository ID1358408598; private organization pilot ID1408025382.')
