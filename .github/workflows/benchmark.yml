name: Full browser performance backstop

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:budget
      - run: npm run benchmark -- --full
      - run: python scripts/summarize_benchmark.py test-results/performance/results.json
      - name: Preserve full benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-browser-performance
          path: |
            test-results/performance/results.json
            test-results/performance/results.md
            test-results/performance/*.png
          if-no-files-found: error
          retention-days: 14
