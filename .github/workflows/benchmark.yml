name: Full browser performance backstop

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:budget
      - run: npm run benchmark -- --full
      - run: python scripts/summarize_benchmark.py test-results/performance/results.json
      - name: Preserve full benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-browser-performance
          path: |
            test-results/performance/results.json
            test-results/performance/results.md
            test-results/performance/*.png
          if-no-files-found: error
          retention-days: 14
