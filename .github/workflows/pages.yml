name: Publish report to GitHub Pages

on:
  schedule:
    # Mondays at 08:00 EDT / 07:00 EST. Regenerates the 12-week report.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  build:
    needs: validation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reports repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Clone HemSoft repos for commit scanning
        shell: bash
        env:
          # Read access to Contents, Issues, and Pull requests on HemSoft repositories.
          GH_TOKEN: ${{ secrets.REPORTS_PAT }}
        run: |
          test -n "$GH_TOKEN" || { echo "REPORTS_PAT is required to include private repositories."; exit 1; }
          timeout 120 gh auth setup-git
          mkdir -p checkouts public
          python -m src.collector --list-repositories > repositories.txt
          while read -r repo; do
            echo "Cloning $repo ..."
            timeout 300 gh repo clone "$repo" "checkouts/${repo#*/}" -- --quiet
          done < repositories.txt

      - name: Generate report to public/index.html
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPORTS_PAT }}
        run: |
          python cli.py --weeks 12 --base-dir ./checkouts --output ./public/index.html --json-out ./public/metrics.json
          touch ./public/.nojekyll
          ls -lh ./public/

      - name: Archive Pages artifact
        shell: bash
        run: tar --dereference --hard-dereference --directory public -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
