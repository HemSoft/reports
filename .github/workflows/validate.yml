name: Validate report

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_tests.py

  quality:
    name: Lint and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run lint:python
      - run: npm run lint:markdown
      - name: Measure branch coverage and function risk
        run: python scripts/check_risk.py
      - name: Preserve function risk report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: function-risk
          path: |
            test-results/risk.json
            test-results/risk.md
            test-results/coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate workflow configuration
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve visual walkthrough
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-walkthrough
          path: test-results/browser/**/video.webm
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-evidence
          path: |
            test-results/accessibility.json
            test-results/cadence-accessibility.yml
            test-results/accessible-data.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve responsive layout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-layout
          path: test-results/layout-*
          if-no-files-found: ignore
          retention-days: 7

  mutation:
    name: Mutation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_mutations.py
      - name: Preserve mutation outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: test-results/mutation/results.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validation
    if: always()
    needs: [unit, quality, mutation, security, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: test "$UNIT_RESULT" = success && test "$QUALITY_RESULT" = success && test "$MUTATION_RESULT" = success && test "$SECURITY_RESULT" = success && test "$PERFORMANCE_RESULT" = success

  performance:
    name: Browser performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:budget
      - run: npm run benchmark:probe
      - run: npm run benchmark
      - run: python scripts/summarize_benchmark.py test-results/performance/results.json
      - name: Preserve browser performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-performance
          path: |
            test-results/performance/*results.json
            test-results/performance/results.md
            test-results/performance/*.png
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: npm ci
      - run: python scripts/check_security.py
      - run: python -m unittest discover tests/security
      - run: python -m pip_audit -r requirements-dev.txt -r requirements-security.txt
      - run: npm audit --audit-level=low
